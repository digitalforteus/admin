name: check

on: push

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -ppassword" --health-interval=5s --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql
          coverage: pcov

      - uses: ramsey/composer-install@v4

      - run: cp .env.example .env

      - run: npm ci && npm run build

      - run: composer check

      # Deploy only when everything above passed. See "Deploying on a green check"
      # in the README for the secret this reads.
      # - name: deploy
      #   if: github.ref == 'refs/heads/main'
      #   run: curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
      #   env:
      #     DEPLOY_HOOK: ${{ secrets.LARAVEL_CLOUD_DEPLOY_HOOK }}
